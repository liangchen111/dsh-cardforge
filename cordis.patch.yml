# 把「制卡工坊」插进当前 profile 的插件组合。
#
# 这一份是**给「贴包名直装」用的**（DSH/ElecKoi → 侧栏「添加插件」→ 填包名
#   dsh-cardforge
# 装完由 DSH 自己读包里的 package.json → dsh.bundle.patch → 这个文件）。
# 源码仓库（github.com/liangchen111/dsh-cardforge）是私有的，对外只有 npm 这条安装路。
#
# 同一份内容另有一处：`插件/制卡工坊/cordis.patch.yml`（给「把插件目录拷进 profile」那种装法）。
# **两处的 config 默认值必须一致** —— `门禁.py` 里有一条断言盯着它，改一处不改另一处会当场红。
#
# 下面 config 全是**出厂默认**，一颗字都不用改就能用：
#   python      —— 跑 forge.py 的解释器；**留空＝自动找**（挨个试常见位置，优先能 import yaml 的）
#   pythonPath  —— 追加到 PYTHONPATH 的依赖目录（装着 PyYAML）；留空＝不加
#   forge       —— forge.py 的位置；留空＝自动用插件目录往上两级的 forge.py
#   cwd         —— 默认工作目录；留空＝用 `<用户目录>/Documents/ElecKoi卡库`（会自动建）
#   timeoutMs   —— 单条命令的墙钟上限
#   installPreset  —— 装插件时顺手把「制卡助手」创作预设装进 ElecKoi；不想要就改 false
#   activatePreset —— 装完若当前还是官方默认创作预设，就顺手切过去；你自己选过的不动
# 自动找挑错了（机器上有好几个 Python）才需要在 python 那一行写死完整路径。
- insert:
    - id: cardforge
      name: 'dsh-cardforge'
      config:
        python: ''
        pythonPath: ''
        forge: ''
        cwd: ''
        timeoutMs: 180000
        installPreset: true
        activatePreset: true
