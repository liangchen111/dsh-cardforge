# 这份是 YAML 子集读取器的「最刁的」语料 —— 手写的，专门踩边角。
# 规矩：**这份文件必须同时被 PyYAML 和 JS 子集解析器读成同一个结构**，
# 差分台拿 PyYAML 解析回来做结构相等比较。改它之前先想清楚两边会怎么读。
格式: eleckoi.test-snapshot
版本: 1
真: true
假: False
是: yes
否: off
空一: ~
空二: null
空三:
整数: 42
负整数: -7
下划线整数: 1_000
十六进: 0x1F
浮点: 3.14
科学: 1e3
串一: 朴素标量
串二: '单引号里的 # 不是注释'
串三: "双引号里的普通字符串"
串四: '里面有两个''单引号'
井号在中间: a#b 不是注释
冒号在中间: a:b 也不是
注释在尾: 值 # 这是注释
中文键「引号」: 值
列表:
- 甲
- 乙
- 3
紧凑映射:
- id: e1
  title: 第一条
  nested:
    a: 1
    b:
    - x
    - y
- id: e2
  title: '第二条'
  flags: [normal, always]
同缩进序列:
- 一
- 二
嵌套:
  里层:
    更深: 值
    deeper:
      list:
        - k: v
          m: n
流序列: [1, 2, '三', [4, 5]]
流映射: {a: 1, b: '二', c: [x, y]}
块字面: |
  第一行
  第二行

  第四行（前面空了一行）
块字面去尾: |-
  不带尾换行
块字面去尾二: |-
  也带一段
    更深的一行
块折叠: >
  折成
  一行

  空行分段
多行朴素: 这一行的值
  接着写
  再接着写
尾部空白: 值
