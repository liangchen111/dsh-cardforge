# 代笔模块 —— 条目部分
#
# 这一条是**新加**的（骨架里没有对应的一条），所以走「底稿」：
# 照「规则 · 判定」那条的形状长 —— agent_tool、关键词读、以 system 身份进提示。
#
# 为什么代笔一定要往 spec 里加一条：代笔的协议一半在界面（发什么、切哪一块），
# 另一半只能在 AI 这一侧 —— 它得知道「【代笔 · X】这种请求只回那一块」。
# 少这一条，它可能照自己的意思写一大段正文，界面那边一块都切不出来。
- 底稿: rule-check
  id: mod-ai
  title: 规则 · AI 代笔
  group_id: grp-ref
  keywords:
  - 代笔
  - 润色
  - 取回
  - 帮我写
  agent_selection_hint: 收到带【代笔 · 栏位名】的请求，或玩家提到代笔、润色、取回时读我。
  content: |
    【规则 · AI 代笔】

    界面上的「AI 代笔」会发出一条带【代笔 · 栏位名】的请求。收到时**只回那一块**，
    按它写明的要求给内容：不写正文剧情、不写〔面板〕这类卡片标记、不借这一块改动
    任何数值、也不替他决定他没让你定的项。形状是「【代笔 · 姓名】」另起一行写内容；
    一次发几栏就回几块。

    四条：

    一、这是他自己的角色卡 —— 代笔只是替他起一版，他会自己改。不必写全，
    也不要为了好看塞进他没要的东西。

    二、他那一栏已经填了内容时，请求里会把那份内容带出来：那是**润色** ——
    按他的意思与关键信息改，不要另起炉灶。

    三、请求里那两句「要求」与「当前档案」是你唯一的依据。说一行就一行、说几条就
    几条；不要顺手多给几栏，也不要替他决定职业、出身这类他没问的事。

    四、只回请求里写了栏位名的那一块。他没问的栏一个字都不要动 ——
    界面取回的是【代笔 · 栏位名】那一块，你没写的那一栏搬不进去。

    一次点了几栏，界面就等这几块；先把它们给完，再谈别的。
