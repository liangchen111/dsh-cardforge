    name: 玩家
    parent_id: ''
    enabled: true
    description: 玩家角色的档案。建卡时由玩家声明写入，此后由玩家掌握。
    update_rule: 建卡阶段由玩家逐项声明后写入；建卡之后，姓名/性别/种族只有玩家明确要求才可修改，AI 不得代为决定。
    dynamic_key: false
    order: 2
    tree_view_order: 10
    created_at: '2026-01-01T00:00:00+08:00'
    updated_at: '2026-01-01T00:00:00+08:00'
  - id: obj-archive
    name: 存档
    parent_id: ''
    enabled: true
    description: 建卡器那块「档案备份」的过夜处。导出时这一格被写成整份备份（界面上正在填的草稿 ＋ 已经封缄的档案），按「从存档取回」就能把表单填回来。它跟玩家档案住在同一套变量系统里，所以也是按会话存的 —— 重启软件、关掉这段对话再回来都在；新开一段对话是另一局，那里是空的。这是给机器用的位子：AI 不读、不写、也不在叙事里提它。没接「备份」模块的卡，它一直空着。
    update_rule: AI 一律不得读写本对象下的任何变量；它只由建卡器那一侧的界面自己维护。
    dynamic_key: false
    order: 4
    tree_view_order: 20
    created_at: '2026-01-01T00:00:00+08:00'
    updated_at: '2026-01-01T00:00:00+08:00'
  variables:
  - id: variable-skel-pressure
    title: 压力源
    object_id: obj-world-settings
    enabled: true
    type: boolean
    default_value: 'false'
    description: 控制要不要加载「可选 · 时局压力」那一条。false = 不加载、不消耗上下文；true = 每轮加载。
    update_rule: 由玩家手动开关，AI 不得自行修改。
    read_mode: on_demand
    order: 1
    tree_view_order: 1
    created_at: '2026-01-01T00:00:00+08:00'
    updated_at: '2026-01-01T00:00:00+08:00'
