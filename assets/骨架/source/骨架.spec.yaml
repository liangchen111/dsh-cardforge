    object_id: obj-world-settings
    enabled: true
    type: string
    default_value: 标准
    description: 一个由玩家自己填含义的档位。本卡不解释这三档分别是什么；玩家在自己的智能体预设里定义它们，并绑到这个变量上。
    update_rule: AI 不得自行修改，也不得替玩家解释、发明这几档的含义。
    read_mode: required
