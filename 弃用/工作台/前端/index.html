<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElecKoi 制卡工作台</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<script>window.__TOKEN__ = "__FORGE_TOKEN__";</script>

<header class="top">
  <div class="brand"><b>制卡工作台</b><span class="tag">ElecKoi</span></div>
  <label class="root">
    <span>从哪儿找卡</span>
    <input id="rootInput" spellcheck="false" autocomplete="off">
  </label>
  <button class="btn" id="btnRoot">换目录</button>
  <button class="btn" id="btnReload">刷新</button>
  <span class="grow"></span>
  <button class="btn" id="btnTrash">回收站</button>
  <button class="btn" id="btnImport">导入现成的卡</button>
  <button class="btn" id="btnPackIn">收一个包</button>
  <button class="btn primary" id="btnNew">＋ 开新卡</button>
</header>

<div class="layout">
  <aside class="sider">
    <div class="sider-head"><span id="siderTitle">我的卡</span><span class="count" id="siderCount"></span></div>
    <div class="sider-list" id="siderList"></div>
    <div class="sider-foot" id="siderFoot"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="mask hidden" id="mask"></div>
<div class="modal hidden" id="modal"></div>
<div class="toast hidden" id="toast"></div>

<script src="/static/app.js"></script>
</body>
</html>
