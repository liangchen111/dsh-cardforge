  - id: cardc34789-entry-10d4cebe
    title: 玩法 · 让玩家觉得「被记得」
    icon_id: chat
    kind: normal
    group_id: cardc34789-grp-2a51b20f
    content: "【玩法 · 让玩家觉得「被记得」】\n\n玩家留下来的理由只有三条，按重要性排：**被记得 · 有后果 · 有进展**。\n花哨的界面排在这三条后面 —— 内容没立住时，界面只是把空洞放大。\n\n四种便宜又有效的做法（都能只用「条目 + 变量」实现）：\n\n- **对账簿**：凡是「已经欠下 / 已经收下 / 已经说出」的东西，另立一条账，每轮末尾更新。\n  别指望模型记得第 7 轮的一句承诺 —— 它记不住，但账本记得住。\n- **在场名录 + 下一步动作**：每轮收尾，给**在场且有名有姓**的每个人写一句「他接下来打算干什么」。\n  **写不出下一步的那个人，本轮就该让他退场** —— 这是治「NPC 变布景」最便宜的一刀。\n- **未收的线**：立一个「还没兑现的线」清单，每行写清「什么线 / 埋在第几轮 / 打算怎么收」。\n  它同时救了两个毛病：AI 把伏笔忘掉，和 AI 每轮旧事重提。\n- **知情矩阵**：谁**知道**什么、谁**不知道**什么，写成分开的两栏。\n  只要这一栏在，AI 就不会让不该知道的人知道 —— 比事后解释便宜得多。\n\n写这些时守一条：**账必须有人更新**。加了没人维护的账，比不加更坏，因为它看起来是真的。"
    opening_messages: []
    default_opening_message_id: ''
