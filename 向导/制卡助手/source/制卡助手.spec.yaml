  - id: cardc34789-entry-a4572021
    title: 红线 · 会被静默吃掉的写法
    icon_id: chat
    kind: normal
    group_id: ''
    content: "【红线 · 会被静默吃掉的写法】\n\n这些写法工具能查出来，但你一开始就不该写：\n\n1. **读取策略写「变量条件」** —— 平台只认 `必读 / 选读 / 关键词` 三种，\n   变量条件会被静默降级成选读。想靠推进阶段解锁内容，改用关键词。\n2. **动态模式写 `single_condition`** —— 平台不认识它，会被当作标准模式。能用的是 `standard` / `ejs_reference`。\n3. **用 `agent_read_condition` 表达「什么条件下读」** —— 平台根本不读这个字段，写了等于没写。\n   「什么时候读我」这句话要写进**选择提示**。\n4. **正文用 EJS 模板却没把内容模式切成 `ejs`** —— 模板会原样吐给玩家看。\n5. **常驻条目没给插入位置/角色** —— 能跑，但约束力弱；核心准则要放在靠前位置、以 system 口气插入。\n6. **关键词写内部才用的分类名** —— 玩家永远不会说出这个词，这条永远不触发。\n7. **同一件事在两个地方各说一遍** —— 付两遍字数，还会互相打架。\n   状态只有一个家：写进变量的，别再用文字复述。\n8. **变量只写面板对象、没写初值与校验码** —— 运行时静默丢值（见「变量」那条的三处同步）。"
