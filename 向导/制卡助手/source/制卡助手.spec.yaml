  - id: cardc34789-entry-2a001b5e
    title: 玩法 · 给玩家的选择要像真的
    icon_id: chat
    kind: normal
    group_id: cardc34789-grp-2a51b20f
    content: "【玩法 · 给玩家的选择要像真的】\n\n玩家不是在读小说，是在**做决定**。每到岔路，他该看见几个**真的不一样**的方向。\n\n- **选项之间差的是代价，不是好坏**：花钱 / 花时间 / 得罪人 / 冒风险 / 欠人情。\n  全是「好事 / 坏事」二选一，等于没得选。\n- **一次覆盖三种对象**：**对人**（找谁谈、怎么谈）、**对环境**（去哪儿、拿什么、拆什么）、\n  **对时间**（等一等、现在就做、先去做别的）。\n- **封闭场景要给够 4–6 条**。玩家被关在一间屋子里时，只给两条他会原地打转。\n- **至少留一条不选边的路**（谁都不站、谁也不得罪）—— 玩家有权不下注。\n\n三条反面：① 所有选项通向同一个结果（假选择）；② 选项里替玩家写好了态度\n（「你愤怒地拔剑」—— 把他的情绪也定了）；③ 把选项写进散文里让他自己找。\n\n选项要能给界面渲染成按钮（做法见「前端 · 小手机不是一条正则」），\n而且**玩家选了什么，就得承担相应的后果** —— 只给选项不给后果，第三次他就不挑了。"
