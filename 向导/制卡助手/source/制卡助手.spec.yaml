  - id: cardc34789-entry-3c88a20f
    title: 界面 · EJS 是这门卡的编程语言
    icon_id: chat
    kind: normal
    group_id: cardc34789-grp-132119a9
    content: "【界面 · EJS 是这门卡的编程语言】\n\n**EJS ＝ ElecKoi JavaScript**，跑在**显示模板**里：把 AI 那一条**完整回复**算成**消息界面**。\n它**不写回原文，也不进模型的请求** —— 算的是「给玩家看的这一层」。\n\n**先分清两个 EJS**（很多人混）：\n\n- **设定库里的 EJS** —— 产出的是**给 AI 读的设定文字**；\n- **显示模板里的 EJS** —— 产出的是**消息界面**。\n\n两者独立，互不影响。\n\n**语法**（锁 EJS 3.1.10，标准语义）：\n\n| 写法 | 作用 |\n|---|---|\n| `<% 代码 %>` | 执行 JS，不输出 |\n| `<%= 表达式 %>` | 输出并**转义 HTML** |\n| `<%- 表达式 %>` | 原样输出（你自己造 HTML 时才用） |\n| `<%# 注释 %>` | 不执行不输出 |\n\n支持 `if/else`、`for`、数组方法、函数、正则、`await`（模板按异步函数编译）。\n\n**挂法三选一**：AI 消息**开头** / 消息**末尾** / **替换消息片段**（填正则正文 + 标志，\n例如 `g`；**别写 `/…/g` 那层外壳**）。\n\n**手上有什么**：`rawContent`（完整原文）· `content`（当前显示正文，显示正则已生效）·\n`message` · `variables` 与 `getvar('路径')`（**那条消息的历史变量快照**）·\n`match` / `captures` / `groups` / `index`（仅替换模式）。\n\n**四条最容易踩的：**\n\n1. **变量是冻结的 —— 显示模板只许读、不许结算。** 没有历史快照时 `getvar` 直接报错；\n   **不许拿当前聊天变量顶替历史状态**。要改变量，那是原生脚本的活儿。\n2. **替换是在 `content` 上匹配的**（不是 `rawContent`）。`g` 才全替换，没有 `g` 只换第一处。\n3. **新模板和导入的库默认停用** —— 写完要显式启用，不启用等于没写。\n4. **有硬上限**：每次计算最多 **3 秒**、单模板与总输出上限 **200 万字符**，超时直接终止。\n\n**要交互**（按钮、填写输入框）就输出**完整 HTML 文档**：`<head>` 里有**且只有一个**\n`<meta name=\"eleckoi-author-api\" content=\"0.1.0\">`，脚本等 `window.ElecKoiReady`。\n**模板里不许用 Node 模块、npm 导入、DOM 或产品 SDK** —— 模板负责生成结果，\n输出 HTML 里的脚本负责交互。\n\n计算顺序：共享全局 → 当前扮演预设 → 当前角色，每个库内按列表顺序。\n\n官方出处：`https://eleckoi.github.io/ElecKoi/docs/plugins/ejs-display-templates.html`\n（作者 SDK：`…/docs/plugins/author-sdk.html`）。"
    opening_messages: []
    default_opening_message_id: ''
