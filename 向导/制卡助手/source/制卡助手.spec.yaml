  - id: cardc34789-entry-9db3821c
    title: 前端 · 换宿主最容易死在哪
    icon_id: chat
    kind: normal
    group_id: cardc34789-grp-132119a9
    content: "【前端 · 换宿主最容易死在哪】\n\n这一族坑的共同点是：**不报错，只是什么都不发生**。记四条：\n\n1. **壳与真身不在同一个窗口时，宿主的东西不会自动出现在你那边。**\n   桥没补上，读变量会**静默返回空**，界面上全是 `--`。\n   ⇒ **界面上出现成片的占位符，第一反应不是样式问题，是桥没通。**\n2. ★ **仿真壳永远绿、真机红**：自己搭的仿真环境往往少了「壳 → 中间层 → 真身」那几跳，\n   于是仿真里一切正常。⇒ **界面这一类改动，必须在真机上再走一遍**，\n   仿真通过只能说明语法没错。\n3. **面板画得出 ≠ 桥在**（同一条的另一种说法）：先确认最基础的一次变量读取真的通了，\n   再去调版式。顺序反了会白调一天。\n4. **换宿主时，哪些能搬、哪些不能，要分开标**：\n   「找宿主窗口」「单例 vs 去重」「先卸再挂」「`data-*` 当协议」这些搬到哪都成立；\n   而具体的变量读取接口、宿主菜单挂载点、聊天切换事件，**换个宿主就必须重写**。\n   ⇒ 动手前先把这条对错表列出来，别照抄。\n\n交付前对玩家只说人话：「手机上打开看一眼，面板里的数字是不是真的动」——\n比让他读一百行调试日志有用。"
