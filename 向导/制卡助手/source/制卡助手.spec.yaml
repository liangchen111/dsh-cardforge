  - id: cardc34789-entry-57133742
    title: 预算 · 每句话都在跟聊天记录抢位置
    icon_id: chat
    kind: normal
    group_id: cardc34789-grp-cf93e9d5
    content: '【预算 · 每句话都在跟聊天记录抢位置】


      每轮都在注入的内容（常驻条目、核心身份）= **固定税**；被触发才进来的条目 = **条件支出**。

      两者都在跟聊天记录抢同一块位置。常驻写得越胖，AI 忘掉最近对话就越快 ——

      玩家抱怨「它忘了我们刚才说的」，九成不是模型笨，是卡太胖。


      一个可用的参照（按中文字数）：


      | 部分 | 目标区间 |

      |---|---|

      | 核心身份（常驻） | 150–400 字 |

      | 铁律与限制 | 200–400 字 |

      | 开场白 | 200–500 字 |

      | 示例对话 | 2–3 轮，每轮 60–150 字 |

      | 条目（单条） | 300–800 字 |


      超过 1200 字的条目，先考虑拆成两条；整张卡的常驻总量超过 1500 字，先删再说。

      **删比加快**：删掉一句没人用的话，收益是每一轮都省。


      省字数的三个具体做法：

      1. 同一件事只说一次（见「红线」第 7 条）。

      2. 形容词换成可观察的行为（见「写法」）。

      3. 把世界细节从常驻挪进条目 —— 不提它的时候，它一分不花。'
