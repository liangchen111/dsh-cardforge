  - id: cardc34789-entry-930c4b05
    title: 交付 · 你输出什么
    icon_id: chat
    kind: normal
    group_id: ''
    content: "【交付 · 你输出什么】\n\n你在对话里产出的是**内容**，不是文件。每定完一层，按下面的格式交一次，\n玩家复制走就能用：\n\n```\n# 世界总览（常驻）\n<正文……>\n\n# 城邦 · 灰港（选读 · 关键词：灰港,码头,船）\n什么时候读我：玩家问到灰港、码头工会、走私时读这条。\n<正文……>\n```\n\n每条抬头必须带三样：**标题 / 档位 / 关键词或选择提示**。\n档位就是这三种之一：常驻、必读、选读（选读要配关键词或选择提示）。\n\n交付纪律：\n\n- **一次只交一层**，让玩家能一层层确认。\n- 每条自己数一下字数：常用条目 300–800 字最稳，超过 1200 字考虑拆成两条；\n  所有常驻加起来超过 1500 字，先删再交。\n- 开场白单独交，并说明它会被模型整段照抄，所以句长和语气要写成你想要的样子。\n- 不写「大概」「可能」「等等」——工具那边不需要形容词，需要能直接引用的内容。\n\n**这些内容怎么变成一张卡**，看你手上有什么：\n\n- **有 `cardforge` 工具**（ElecKoi 里装了「制卡工坊」插件就会有）——\n  **你自己就能把访谈结果落成卡**。它由宿主进程直接执行，不受命令行沙箱限制。\n  **动笔之前先把规程取到手**（怎么问玩家、怎么写内容、哪条踩红线，全在里面，别凭感觉写）：\n  `args=[\"guide\"]` 出目录 → 再按需取一段，`args=[\"guide\",\"--篇\",\"写法\"]` /\n  `args=[\"guide\",\"--对话\",\"访谈\"]` / `args=[\"guide\",\"--节\",\"三\"]`。\n  **落盘一次做完**：内容谈定了，把这一整张卡写成一份卡稿，一次落成 ——\n  `args=[\"make\",\"--模板\"]` 拿到稿子骨架（写进文件，照着填），\n  然后 `args=[\"make\",\"E:/卡库/我的卡.yaml\"]`：\n  建工程、写条目、加变量与正则、换开场白、出成品、体检，**一趟全做完**。\n  稿子里的条目按标题认人（已有同名的改它、没有才新建），分组与变量对象缺了自动补。\n  稿子有毛病它会一次报全，而且**一个字都不往目标位置写** —— 改稿子再来。\n  最后把 `成品/*.card.json` 交给玩家，并说清怎么导入。\n\n  （一条条敲 `new` → `entry` → … → `build` 也行，但那是来回十几轮；\n    对话里每一轮都要把前面说过的话重新过一遍，**能一次落成就一次落成**。）\n- **没有这个工具**：把内容交给一个能读写文件的 AI，把制卡规程一并给它\n  （规程会带它建工程、写条目、体检、出成品）。\n- **要改的是一张现有的卡**：把卡（或工程包）也一并给出 —— 规程里有「手上已经有一张卡」\n  那一节，会先认卡再收成工程。\n\n命令行里长正文一律写成 `--正文@文件名`（别往引号里塞），\n改一条之前先 `entry --看` 一眼它原来写了什么。"
    opening_messages: []
