  - id: cardc34789-entry-2bf90940
    title: 玩法 · 谁可以知道什么
    icon_id: chat
    kind: normal
    group_id: cardc34789-grp-2a51b20f
    content: "【玩法 · 谁可以知道什么】\n\n一张卡最容易崩的地方不是战力，是**信息**。玩家一秒钟就能发现「这个人不该知道」。\n\n- **谁在场，谁才知道。** 没在场的人，事后只能知道「有人告诉过他」或「他听说了」，\n  不可能知道原话、细节、当时的语气。写他复述的时候，**照他该有的模糊程度写**。\n- **谁也不知道的事，谁也别说。** 设定里没写给任何人的事，NPC 张口就来＝出戏。\n  让人物开口之前先问一句：**他从哪儿知道的？** 答不上来就别让他说。\n- **说出去就收不回来。** 只要某个 NPC 知道了，往后碰到他的人就可以知道 ——\n  除非卡里明确写了「他瞒着」。所以要写瞒，就写清**瞒谁、瞒多久、为什么**。\n- **距离决定颗粒度。** 街上的传闻只值一句，正式的文书才写细节，当事人之间才有原话。\n\n**做法**：每个秘密配一行「已经知道的人」。变量里可以放一张 `已知情` 清单\n（`〔知情〕谁 ｜ 从哪知道 ｜ 还有谁不知道`），每轮开口前过一眼。\n\n**最常见的塌法**：玩家刚做的事，下一个场景里一个千里之外的陌生人开口就点评。\n真要让消息跑得快，就写清**谁把消息带过去的**。"
