  - id: cardc34789-entry-3a638e83
    title: 前端 · 小手机不是一条正则
    icon_id: chat
    kind: normal
    group_id: cardc34789-grp-132119a9
    content: "【前端 · 小手机不是一条正则】\n\n小手机 / 面板这类东西，**不是消息楼里的一块正则 HTML**，而是挂在宿主页面上的东西。\n按这个分工写，才不会写成一坨：\n\n- **入口层**：悬浮球 / 移动端抽屉 / 浮窗 —— **只负责发命令**（打开这个、打开那个），\n  自己**绝不读变量**。别再造第四套入口。\n- **内容层**：面板 / 状态栏 —— 读变量、分页、接交互。\n- **挂载层**：谁挂在哪、挂几份。**每楼一份的要自己去重**；挂在宿主页面上的**是单例**。\n\n四条通用纪律（换任何宿主都成立）：\n\n1. **别假定当前窗口就是主窗口**：脚本常跑在 iframe 里。最多向上找几层父窗口，\n   摸到宿主的 `document.body` 为止；**所有输入框操作都走那个宿主窗口**。\n2. **挂新的一份之前，先卸掉旧的**（用固定的键标记自己那份），否则监听会一层层叠上去。\n3. **界面用 `data-*` 属性当协议**（样式改版不会打断逻辑），根上开 `container-type`，\n   窄屏自动单列 —— 手机端是主战场，别只照桌面做。\n4. **大段 HTML 绝不塞进开场白**：它不但撑爆首轮预算，还会让界面在错误的时机出现。\n\n要「把 AI 写的选项变成按钮」时：正则只铺一个空容器，桥去找**最新一楼**的容器填按钮，\n点击默认**填进输入框**（可多选再改），玩家勾了「直发」才真的发送。\n**桥不写变量**，也别在面板里再做一套平行的选项解析。"
    opening_messages: []
    default_opening_message_id: ''
    agent_selection_hint: 玩家要小手机 / 抽屉面板 / 悬浮球 / 状态栏，或要写卡内前端时读这条。
