  - id: card22153f-entry-632aee9e
    title: 任务 · 支线 · 旧账
    icon_id: chat
    kind: normal
    group_id: ''
    content: "【任务 · 支线 · 一笔旧账】\n\n灰鲸帮的收债人「锉刀」每周三上门，收上周的赊账。这一次他带来的数字比账本上多了三成，说多出来的是「停业风险费」。\n\n玩家的选择（都不指向主线结局，只展示锈底的日常）：\n  一、掏钱平事：从诊所的钱币里扣，把数字补上，锉刀走人，本周太平。\n  二、跟锉刀掰扯：翻出账本当面对质，可能谈回原价，也可能激怒灰鲸，引来下一周的加倍。\n  三、动硬的：把锉刀打回去。短期痛快，但灰鲸会记得这家诊所——声望下降，麻烦上门。\n\n给 AI 的提示：这条支线的意义是让玩家感到「锈底的钱是带牙的」。无论怎么选，都别让它轻易升级成主线冲突；两周内给个收尾。"
    opening_messages: []
    default_opening_message_id: ''
    agent_selection_hint: 玩家碰到和旧账有关的线索时读这条
