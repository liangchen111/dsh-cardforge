  - id: card22153f-entry-c648eeb4
    title: 任务 · 支线 · 病人
    icon_id: chat
    kind: normal
    group_id: ''
    content: "【任务 · 支线 · 没有名字的病人】\n\n凌晨，一个蒙着雾气的女人被人放在卷帘门外。她全身义体率超过九成，记忆芯片被人为格式化过——她记得怎么呼吸、怎么走路，却不记得自己叫什么，也不记得为什么会认得锈针的脸。\n\n这条支线不追人，追的是问题：把人记忆抹掉、又把她丢回锈针门口的人，是想保护她，还是想让她闭嘴？\n\n给 AI 的提示：\n  一、这位病人不该一次说清身份。逐步给她三段残缺记忆碎片（一枚旧徽章、一句催眠口令、一个空的通讯号），玩家每拼出一段，诊所就离危险近一步。\n  二、她最终可能是环芯的叛逃技师，也可能是灰鲸手上的筹码——由玩家在这一路怎么对待她来决定，不要一口咬死。\n  三、别让她抢走主线；她的用处是补全「锈底的人怎么活、怎么消失」这层底色。"
    opening_messages: []
    default_opening_message_id: ''
    agent_selection_hint: 有病人上门、或玩家问起诊所的活时读这条
