  replacement: "```html\n<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<style id=\"card22153f-hud-style\">\n/* ============================================================================\n * 锈针 HUD · 样式\n *\n * 规矩一条：所有选择器都带 .hud / .hud- 前缀。\n * 这段 CSS 会整段注进宿主的消息里，前缀就是它和宿主页面之间的边界 ——\n * 漏一个裸选择器（比如 body / .message），宿主的界面就会跟着变形。\n *\n * 另有一条：**这一页里不写死颜色。** 所有颜色、圆角、字体都从下面那组\n * `--hud-*` 槽里取，槽的默认值就是「羊皮卷」。\n * 要换皮肤就跑 `forge theme <主题名> <工程>` —— 它写一份 hud/主题.css，\n * 只覆盖这组槽，这一页一个字都不用改。这样换皮肤和改机制是两件事，\n * 改了一处也不会顺手把另一处弄坏。\n * ========================================================================== */\n\n.hud,\n.hud-ball,\n.hud-ballpanel {\n  /* ---- 文字三层 ---- */\n  --hud-ink: #2f2a22;          /* 正文 */\n  --hud-ink-2: #6b6152;        /* 次级：栏名、小节标题 */\n  --hud-dim: #a2988a;          /* 更淡：说明、空态 */\n\n  /* ---- 底色四层（从最透到最实）---- */\n  --hud-paper: rgba(252, 248, 238, 0.72);   /* 卡片常态 */\n  --hud-paper-solid: rgba(252, 248, 238, 0.9); /* 建卡器：要填字，底子实一点 */\n  --hud-field: rgba(255, 253, 246, 0.9);    /* 输入框 / 扣子 */\n  --hud-panel: rgba(252, 248, 238, 0.97);   /* 悬浮球面板：压在宿主任意背景上 */\n\n  /* ---- 线两层 ---- */\n  --hud-line: rgba(120, 94, 52, 0.28);      /* 常态分隔线 */\n  --hud-line-2: rgba(120, 94, 52, 0.5);     /* 强调：主扣子边、悬浮球边 */\n\n  /* ---- 淡底两块 ---- */\n  --hud-wash: rgba(120, 94, 52, 0.08);      /* 标签 / 注释块 / hover */\n  --hud-wash-2: rgba(120, 94, 52, 0.2);     /* 选中的标签 / 主扣子 */\n\n  /* ---- 强调与警示 ---- */\n  --hud-accent: rgba(120, 94, 52, 0.62);    /* 焦点边 */\n  --hud-danger: #a8442f;                    /* 错误线 */\n  --hud-danger-ink: #7d3324;                /* 错误字 */\n  --hud-danger-wash: rgba(168, 68, 47, 0.09);\n\n  /* ---- 形状 ---- */\n  --hud-shadow: rgba(40, 32, 18, 0.2);\n  --hud-radius: 4px;\n  --hud-radius-s: 3px;\n  --hud-font: -apple-system, \"PingFang SC\", \"Microsoft YaHei\", system-ui, sans-serif;\n\n  box-sizing: border-box;\n}\n\n/* ------------------------------------------------------------------ 卡片 */\n\n.hud {\n  margin: 10px 0;\n  padding: 12px 14px 13px;\n  border: 1px solid var(--hud-line);\n  border-radius: var(--hud-radius);\n  background: var(--hud-paper);\n  color: var(--hud-ink);\n  font: 13.5px/1.75 var(--hud-font);\n}\n\n.hud * {\n  box-sizing: border-box;\n}\n\n/* ------------------------------------------------------------------ 表头 */\n\n.hud-wrap {\n  box-sizing: border-box;\n  color: var(--hud-ink);\n  font: 13.5px/1.75 var(--hud-font);\n}\n\n.hud-wrap__lead {\n  margin: 0 0 8px;\n  color: var(--hud-ink-2);\n  font-size: 12.5px;\n}\n\n.hud__head {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: 8px;\n  padding-bottom: 8px;\n  border-bottom: 1px solid var(--hud-line);\n}\n\n.hud__title {\n  font-size: 13px;\n  font-weight: 700;\n  letter-spacing: 0.16em;\n}\n\n.hud__brief {\n  margin-right: auto;\n  color: var(--hud-ink-2);\n  font-size: 12px;\n}\n\n.hud__body {\n  margin-top: 9px;\n}\n\n.hud.is-fold .hud__body {\n  display: none;\n}\n\n.hud__note {\n  margin-top: 9px;\n  padding: 6px 9px;\n  border-left: 2px solid var(--hud-line);\n  background: var(--hud-wash);\n  font-size: 12px;\n  line-height: 1.65;\n  border-radius: 0 var(--hud-radius-s) var(--hud-radius-s) 0;\n}\n\n.hud__note.is-error {\n  border-left-color: var(--hud-danger);\n  background: var(--hud-danger-wash);\n  color: var(--hud-danger-ink);\n}\n\n/* ------------------------------------------------------------------ 小节 */\n\n.hud-sec + .hud-sec {\n  margin-top: 10px;\n  padding-top: 9px;\n  border-top: 1px dashed var(--hud-line);\n}\n\n.hud-sec__h {\n  margin-bottom: 4px;\n  color: var(--hud-ink-2);\n  font-size: 11.5px;\n  letter-spacing: 0.14em;\n}\n\n.hud-row {\n  display: flex;\n  align-items: baseline;\n  gap: 8px;\n  padding: 1px 0;\n}\n\n.hud-row__k {\n  flex: 0 0 4.6em;\n  color: var(--hud-ink-2);\n  font-size: 12px;\n}\n\n.hud-row__v {\n  flex: 1 1 auto;\n  min-width: 0;\n  word-break: break-word;\n}\n\n.hud-sub {\n  margin: 4px 0 4px 4px;\n  padding-left: 9px;\n  border-left: 1px solid var(--hud-line);\n}\n\n.hud-sub--deep {\n  margin-left: 2px;\n  opacity: 0.92;\n}\n\n.hud-sub__t {\n  color: var(--hud-ink-2);\n  font-size: 11.5px;\n  letter-spacing: 0.1em;\n}\n\n.hud-tag {\n  display: inline-block;\n  margin: 1px 4px 1px 0;\n  padding: 1px 6px;\n  border: 1px solid var(--hud-line);\n  border-radius: 2px;\n  background: var(--hud-wash);\n  font-size: 12px;\n}\n\n.hud-tag.is-on {\n  border-color: var(--hud-line-2);\n  background: var(--hud-wash-2);\n}\n\n.hud-dim {\n  color: var(--hud-dim);\n  font-size: 12px;\n}\n\n.hud-empty {\n  padding: 6px 0;\n  color: var(--hud-dim);\n  font-size: 12px;\n}\n\n/* ---------------------------------------------------------------- 建卡器 */\n\n.hud--create {\n  background: var(--hud-paper-solid);\n}\n\n.hud__grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));\n  gap: 8px 10px;\n  margin-top: 10px;\n}\n\n.hud-field {\n  display: flex;\n  flex-direction: column;\n  gap: 3px;\n  min-width: 0;\n}\n\n.hud-field--wide {\n  grid-column: 1 / -1;\n}\n\n.hud-field__l {\n  color: var(--hud-ink-2);\n  font-size: 11.5px;\n  letter-spacing: 0.1em;\n}\n\n.hud-input {\n  width: 100%;\n  padding: 5px 7px;\n  border: 1px solid var(--hud-line);\n  border-radius: var(--hud-radius-s);\n  background: var(--hud-field);\n  color: var(--hud-ink);\n  font: inherit;\n  font-size: 13px;\n}\n\n.hud-input:focus {\n  outline: none;\n  border-color: var(--hud-accent);\n  background: var(--hud-field);\n}\n\n.hud-input--area {\n  resize: vertical;\n  min-height: 58px;\n  font-size: 12.5px;\n  line-height: 1.6;\n}\n\n.hud__row {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 7px;\n  margin-top: 10px;\n}\n\n.hud__foot {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: 9px;\n  margin-top: 11px;\n  padding-top: 10px;\n  border-top: 1px solid var(--hud-line);\n}\n\n/* ------------------------------------------------------------------ 扣子 */\n\n.hud-btn {\n  padding: 6px 12px;\n  border: 1px solid var(--hud-line);\n  border-radius: var(--hud-radius-s);\n  background: var(--hud-field);\n  color: var(--hud-ink);\n  font: inherit;\n  font-size: 12.5px;\n  cursor: pointer;\n}\n\n.hud-btn:hover {\n  background: var(--hud-wash);\n}\n\n.hud-btn--main {\n  border-color: var(--hud-line-2);\n  background: var(--hud-wash-2);\n  font-weight: 700;\n  letter-spacing: 0.08em;\n}\n\n/* 次要动作压成灰底小字：留着能用，但不跟主扣子抢视线 */\n.hud-btn--quiet {\n  padding: 4px 8px;\n  border-color: var(--hud-line);\n  color: var(--hud-ink-2);\n  font-size: 11.5px;\n}\n\n/* ---------------------------------------------------------------- 悬浮球 */\n\n.hud-ball {\n  position: fixed;\n  z-index: 2147483000;\n  width: 42px;\n  height: 42px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  border: 1px solid var(--hud-line-2);\n  border-radius: 50%;\n  background: var(--hud-panel);\n  color: var(--hud-ink);\n  font: 700 15px/1 var(--hud-font);\n  cursor: grab;\n  user-select: none;\n  -webkit-user-select: none;\n  touch-action: none;\n  box-shadow: 0 2px 10px var(--hud-shadow);\n}\n\n.hud-ball:active {\n  cursor: grabbing;\n}\n\n.hud-ballpanel {\n  position: fixed;\n  z-index: 2147482999;\n  width: 258px;\n  max-height: 62vh;\n  overflow: auto;\n  padding: 10px 12px 12px;\n  border: 1px solid var(--hud-line-2);\n  border-radius: var(--hud-radius);\n  background: var(--hud-panel);\n  color: var(--hud-ink);\n  font: 12.5px/1.7 var(--hud-font);\n  box-shadow: 0 6px 22px var(--hud-shadow);\n}\n\n.hud-ballpanel__t {\n  margin-bottom: 6px;\n  padding-bottom: 6px;\n  border-bottom: 1px solid var(--hud-line);\n  color: var(--hud-ink-2);\n  font-size: 11.5px;\n  letter-spacing: 0.16em;\n}\n\n.hud-ballpanel .hud-sec__h {\n  margin-top: 8px;\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .hud-ball,\n  .hud-ballpanel {\n    transition: none;\n  }\n}\n\n</style>\n</head>\n<body>\n<div class=\"hud-wrap\">\n  <p class=\"hud-wrap__lead\">这是一张锈针卡：界面、变量、构建链都是空的，只把形状立住了。</p>\n  <div data-view=\"create\"></div>\n</div>\n<script>\n/* ============================================================================\n * 锈针 HUD —— 一张卡最小但能跑起来的界面层\n *\n * 它不含任何世界观内容，做的是四件事：\n *   ① 把宿主（ElecKoi）的接口包一层，读得到变量、写得回变量；\n *   ② 把变量树原样渲染成一块面板（你加变量，面板上就多一行，不用改代码）；\n *   ③ 一间建卡器 —— 把「玩家」那份档案填成表单，封缄即写回变量；\n *   ④ 一颗常驻悬浮球（可拖拽，点开就是那块面板）；\n *   ⑤ 一个接线口，给「选着接」的模块（骰子框、尺度说明……见 hud/模块/）。\n *\n * 三个视图共用这一份代码，靠页面上的 data-view 认领：\n *   data-view=\"create\"  → 建卡器（只在开场那一条消息里）\n *   data-view=\"card\"    → 面板（每轮回复末尾）\n *\n * 改内容改 source/*.spec.yaml；改样子改 hud.css；改这里 = 改机制。\n * ========================================================================== */\n(function () {\n  'use strict';\n\n  /* ---------------------------------------------------------------- 配置 */\n\n  var CONFIG = {\n    /* 变量树里那两个顶层对象的键名 */\n    playerObject: '玩家',\n    worldObject: '世界设定',\n    /* 备份模块**过夜**的那个位子：变量树里一个「给机器用的」对象，里面一格文本。\n       它跟玩家档案住在同一套变量系统里，所以也是按会话存的 —— 重启软件、关掉这段\n       对话再回来都还在；新开一段对话是另一局，那里自然是空的（这正是我们要的）。\n       **跨局那一半不在这儿**：备份模块自己再压一份到宿主窗口的 localStorage\n       （按机器存，钥匙由模块的 FORMAT 派生），本局这一格空着时「从存档取回」退到它。\n       模块不写死这两个名字，照这里现读 —— 想把那格叫别的，改这一行就够。\n       没接备份模块时它一直空着，面板上只会显示一行「机器位」。 */\n    archiveObject: '存档',\n    archiveSlot: '角色',\n    /* 玩家侧的两个档位 */\n    scaleKey: '叙事尺度',\n    scaleValues: ['克制', '标准', '放开'],\n    pressureKey: '压力源',\n    /* 建卡器上出现的字段；加一行就多一栏，不用动别处。\n       type: text / number / list（list = 一行一件，写回是数组） */\n    fields: [\n      { key: '姓名', label: '姓名', type: 'text', hint: '写你在这个世界里用的名字' },\n      { key: '性别', label: '性别', type: 'text', hint: '不填也行' },\n      { key: '种族', label: '种族', type: 'text', hint: '你生来是什么' },\n      { key: '等级', label: '等级', type: 'number', min: 1, max: 20, hint: '1 到 20' },\n      { key: '状态', label: '状态', type: 'text', hint: '开场时是什么情形' },\n      { key: '钱币', label: '钱币', type: 'number', min: 0, max: 9999999, hint: '身上的钱' },\n      { key: '背包', label: '背包', type: 'list', hint: '一件一行' }\n    ],\n    /* 写回变量后，替玩家放进输入框里的一句话（只填不送，见 submit） */\n    openingAsk: '我已经写好了自己的角色，请开场。'\n  };\n\n  /* 变量初值 —— 必须与 spec 的 initial_state 一致；\n     这里是运行时兜底：宿主还没初始化时，界面也该画得出东西。\n     「存档」那一格也要在这儿占位：fillState 会把初值里没有的对象原样留着不假，\n     但面板要靠它才画得出「机器位」那一行。 */\n  var DEFAULTS = {\n    世界设定: { 压力源: false, 叙事尺度: '标准' },\n    玩家: { 姓名: '', 性别: '', 种族: '', 等级: 1, 状态: '正常', 钱币: 0, 背包: [] },\n    存档: { 角色: '' }\n  };\n\n  /* ---------------------------------------------------------------- 小工具 */\n\n  function $$(sel, root) { return (root || document).querySelector(sel); }\n\n  function each(sel, fn, root) {\n    var list = (root || document).querySelectorAll(sel);\n    for (var i = 0; i < list.length; i++) fn(list[i], i);\n  }\n\n  function esc(s) {\n    return String(s == null ? '' : s)\n      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')\n      .replace(/\"/g, '&quot;').replace(/'/g, '&#39;');\n  }\n\n  function str(v) { return String(v == null ? '' : v).trim(); }\n\n  function num(v, fallback) {\n    var n = typeof v === 'number' ? v : parseFloat(str(v));\n    return isFinite(n) ? n : (fallback == null ? 0 : fallback);\n  }\n\n  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }\n\n  function isArr(v) { return Object.prototype.toString.call(v) === '[object Array]'; }\n\n  function plain(v) { return v && typeof v === 'object' && !isArr(v) ? v : null; }\n\n  function msgOf(err) { return (err && err.message) ? err.message : String(err); }\n\n  function safeText(node, text) { if (node) node.textContent = text == null ? '' : String(text); }\n\n  /* 把「一行一件」的文本切成数组；空白行丢掉，首尾空格去掉 */\n  function parseList(text) {\n    var lines = String(text == null ? '' : text).split(/\\r?\\n/);\n    var out = [];\n    for (var i = 0; i < lines.length; i++) {\n      var s = str(lines[i]);\n      if (s) out.push(s);\n    }\n    return out;\n  }\n\n  /* 数组 -> 一行一件的文本（写进 textarea 用） */\n  function joinList(arr) {\n    if (!isArr(arr)) return arr == null || arr === '' ? '' : String(arr);\n    var out = [];\n    for (var i = 0; i < arr.length; i++) out.push(String(arr[i] == null ? '' : arr[i]));\n    return out.join('\\n');\n  }\n\n  /* ------------------------------------------------------------ ElecKoi 桥 */\n\n  function api() { return (typeof window !== 'undefined' && window.ElecKoi) || null; }\n\n  /* 宿主的运行时是注入进来的，通常要等一两个 tick */\n  function whenReady(cb, tries) {\n    var left = tries == null ? 60 : tries;\n    if (api()) { cb(api()); return; }\n    if (left <= 0) { cb(null); return; }\n    setTimeout(function () { whenReady(cb, left - 1); }, 50);\n  }\n\n  /* 传数组 = 按位置参数调；传对象 = 按请求体调。\n     SDK 里 getState(options) 收对象，setState(state) / input.set(text) 收位置参数。 */\n  function call(method, params) {\n    var e = api();\n    if (!e) return Promise.reject(new Error('ElecKoi 运行时不可用'));\n    var parts = String(method).split('.');\n    var fn = e;\n    for (var i = 0; i < parts.length; i++) fn = fn && fn[parts[i]];\n    if (typeof fn !== 'function') return Promise.reject(new Error('缺少接口：' + method));\n    try {\n      var self = e;\n      for (var j = 0; j < parts.length - 1; j++) self = self[parts[j]];\n      var out = isArr(params) ? fn.apply(self, params) : fn.call(self, params || {});\n      return Promise.resolve(out);\n    } catch (err) {\n      return Promise.reject(err);\n    }\n  }\n\n  function readState() {\n    return new Promise(function (resolve) {\n      var e = api();\n      if (!e || !e.variables || typeof e.variables.getState !== 'function') { resolve({}); return; }\n      Promise.resolve(e.variables.getState({})).then(function (state) {\n        resolve(plain(state) || {});\n      }).catch(function () { resolve({}); });\n    });\n  }\n\n  /* 变量树真正住的地方是 stat_data；万一宿主这一版摊平在顶层，就退到顶层同名键。 */\n  function statOf(state) {\n    var stat = plain(state && state.stat_data);\n    return stat || plain(state) || {};\n  }\n\n  function objectOf(state, name) {\n    var stat = statOf(state);\n    var obj = plain(stat[name]);\n    if (!obj) {\n      var flat = plain(state && state[name]);\n      if (flat) obj = flat;\n    }\n    return obj || {};\n  }\n\n  /* 读「存档」那一格 —— 备份模块过夜的地方。\n     没接那个模块、或者这一局还没存过，读到的就是空串。\n     写它不用另开口子：writeObject(CONFIG.archiveObject, ...) 就是那条路，\n     自己拼一份 setState 出来只会多一处会写错的地方。 */\n  function readArchive(state) {\n    return str(objectOf(state, CONFIG.archiveObject)[CONFIG.archiveSlot]);\n  }\n\n  /* 读到的照搬，缺的键用初值补上 —— 界面上就不会出现 undefined */\n  function fillState(stat) {\n    var out = {}, src = plain(stat) || {};\n    Object.keys(src).forEach(function (k) { out[k] = src[k]; });\n    Object.keys(DEFAULTS).forEach(function (k) {\n      var d = plain(DEFAULTS[k]);\n      if (!d) { if (!(k in out)) out[k] = DEFAULTS[k]; return; }\n      var merged = {}, got = plain(out[k]);\n      Object.keys(d).forEach(function (kk) { merged[kk] = d[kk]; });\n      if (got) Object.keys(got).forEach(function (kk) { merged[kk] = got[kk]; });\n      out[k] = merged;\n    });\n    return out;\n  }\n\n  /* 写回一个人物对象里的若干键。\n     顶层与 stat_data 两份都写：读的时候 stat_data 优先，只写顶层会「写了没反应」。\n     写完读回核对，认不出来的值如实说出来，不假装成功。 */\n  function writeObject(objectName, patch, scope) {\n    var scopeName = scope || document;\n    return readState().then(function (state) {\n      var next = {};\n      Object.keys(state || {}).forEach(function (k) { next[k] = state[k]; });\n      var box = {}, src = objectOf(state, objectName);\n      Object.keys(src).forEach(function (k) { box[k] = src[k]; });\n      Object.keys(patch || {}).forEach(function (k) { box[k] = patch[k]; });\n      next[objectName] = box;\n      if (plain(next.stat_data)) {\n        next.stat_data = fillState(next.stat_data);\n        next.stat_data[objectName] = box;\n      }\n      return call('variables.setState', [next]);\n    }).then(function () {\n      return readState();\n    }).then(function (back) {\n      var got = objectOf(back, objectName);\n      var bad = [];\n      Object.keys(patch || {}).forEach(function (k) {\n        if (JSON.stringify(got[k]) !== JSON.stringify(patch[k])) bad.push(k);\n      });\n      if (!bad.length) return '';\n      return '注意：' + bad.join('、') + ' 没落进变量（可能被 Zod 挡回来了）。' +\n        '可以去变量面板手动改。';\n    });\n  }\n\n  /* 档位：只认配置里那三档，别的一律按中间那一档算 —— 不把怪值摆到界面上 */\n  function scaleOf(state) {\n    var v = str(objectOf(state, CONFIG.worldObject)[CONFIG.scaleKey]);\n    return CONFIG.scaleValues.indexOf(v) < 0 ? CONFIG.scaleValues[1] : v;\n  }\n\n  function nextScale(v) {\n    var i = CONFIG.scaleValues.indexOf(str(v));\n    if (i < 0) i = 1;\n    return CONFIG.scaleValues[(i + 1) % CONFIG.scaleValues.length];\n  }\n\n  function pressureOn(state) {\n    var v = objectOf(state, CONFIG.worldObject)[CONFIG.pressureKey];\n    if (typeof v === 'boolean') return v;\n    return str(v) === 'true';\n  }\n\n  /* -------------------------------------------------------------- 渲染小件 */\n\n  function valueHtml(v) {\n    if (isArr(v)) {\n      if (!v.length) return '<span class=\"hud-dim\">空</span>';\n      var out = [];\n      for (var i = 0; i < v.length; i++) out.push('<span class=\"hud-tag\">' + esc(v[i]) + '</span>');\n      return out.join('');\n    }\n    if (typeof v === 'boolean') {\n      return '<span class=\"hud-tag' + (v ? ' is-on' : '') + '\">' + (v ? '开' : '关') + '</span>';\n    }\n    if (v === '' || v == null) return '<span class=\"hud-dim\">—</span>';\n    if (typeof v === 'object') return '<span class=\"hud-dim\">（嵌套对象）</span>';\n    return esc(v);\n  }\n\n  function rowHtml(label, v) {\n    return '<div class=\"hud-row\"><span class=\"hud-row__k\">' + esc(label) +\n      '</span><span class=\"hud-row__v\">' + valueHtml(v) + '</span></div>';\n  }\n\n  /* 一层对象 -> 若干行；值本身是对象就递归成一小节 */\n  function objectRows(obj, depth) {\n    var out = [];\n    Object.keys(obj || {}).forEach(function (k) {\n      var v = obj[k];\n      if (plain(v) && Object.keys(v).length) {\n        out.push('<div class=\"hud-sub' + (depth ? ' hud-sub--deep' : '') +\n          '\"><div class=\"hud-sub__t\">' + esc(k) + '</div>' +\n          objectRows(v, (depth || 0) + 1).join('') + '</div>');\n      } else {\n        out.push(rowHtml(k, v));\n      }\n    });\n    return out;\n  }\n\n  /* 整棵变量树 -> 面板主体。你往 spec 里加变量，这里就多一行，不用改代码。 */\n  function panelHtml(state) {\n    var stat = fillState(statOf(state));\n    var keys = Object.keys(stat);\n    if (!keys.length) return '<div class=\"hud-empty\">还没有变量。</div>';\n    var out = [];\n    for (var i = 0; i < keys.length; i++) {\n      var name = keys[i], obj = stat[name];\n      out.push('<section class=\"hud-sec\">');\n      out.push('<div class=\"hud-sec__h\">' + esc(name) + '</div>');\n      /* 「存档」那一格是机器位：里面装的是一整份备份（几百上千字的一段 JSON），\n         摊在面板上只会把别的都挤没。它是给机器用的，说清有没有就够了 ——\n         要看内容去建卡器那一页，或者去宿主自己的变量面板。 */\n      if (name === CONFIG.archiveObject) {\n        out.push('<div class=\"hud-dim\">' +\n          (readArchive(state) ? '（机器位 · 存着一份备份）' : '（机器位 · 空）') + '</div>');\n        out.push('</section>');\n        continue;\n      }\n      if (plain(obj)) {\n        out.push(objectRows(obj).join('') || '<div class=\"hud-dim\">（空）</div>');\n      } else {\n        out.push(rowHtml(name, obj));\n      }\n      out.push('</section>');\n    }\n    return out.join('') + moduleBlocks('panel', state);\n  }\n\n  /* 一行摘要：谁、几级、身上什么情形。面板折起来时看这一行就够。 */\n  function briefOf(state) {\n    var p = objectOf(state, CONFIG.playerObject);\n    var bits = [];\n    if (str(p['姓名'])) bits.push(str(p['姓名']));\n    if (str(p['种族'])) bits.push(str(p['种族']));\n    if (str(p['等级']) !== '') bits.push('等级 ' + num(p['等级'], 1));\n    if (str(p['状态']) && str(p['状态']) !== '正常') bits.push(str(p['状态']));\n    return bits.length ? bits.join(' · ') : '尚无角色档案';\n  }\n\n  function hasProfile(state) {\n    var p = objectOf(state, CONFIG.playerObject);\n    return !!str(p['姓名']);\n  }\n\n  /* ---------------------------------------------------------------- 视图 */\n\n  function sectionHtml(state) {\n    return '' +\n      '<div class=\"hud\" data-hud>' +\n      '  <div class=\"hud__head\">' +\n      '    <span class=\"hud__title\">状态</span>' +\n      '    <span class=\"hud__brief\" data-brief>' + esc(briefOf(state)) + '</span>' +\n      '    <button type=\"button\" class=\"hud-btn hud-btn--quiet\" data-act=\"fold\">收起</button>' +\n      '  </div>' +\n      '  <div class=\"hud__body\" data-body>' + panelHtml(state) + '</div>' +\n      '  <div class=\"hud__note\" data-note hidden></div>' +\n      '</div>';\n  }\n\n  function renderCardView(root) {\n    if (!root) return;\n    root.innerHTML = sectionHtml({});\n    bindCard(root);\n    refresh(root);\n  }\n\n  function refresh(root) {\n    return readState().then(function (state) {\n      var box = $$('[data-body]', root);\n      if (box) box.innerHTML = panelHtml(state);\n      safeText($$('[data-brief]', root), briefOf(state));\n      return state;\n    });\n  }\n\n  function noteIn(root, text, kind) {\n    var n = $$('[data-note]', root);\n    if (!n) return;\n    n.hidden = !text;\n    n.className = 'hud__note' + (kind ? ' ' + kind : '');\n    n.textContent = text || '';\n  }\n\n  function bindCard(root) {\n    root.addEventListener('click', function (ev) {\n      var t = ev.target;\n      while (t && t !== root && !t.getAttribute('data-act')) t = t.parentNode;\n      if (!t || t === root) return;\n      var act = t.getAttribute('data-act');\n      if (act === 'fold') {\n        var hud = $$('[data-hud]', root);\n        if (!hud) return;\n        var folded = hud.className.indexOf('is-fold') >= 0;\n        hud.className = folded ? 'hud' : 'hud is-fold';\n        t.textContent = folded ? '收起' : '展开';\n      } else if (act === 'refresh') {\n        refresh(root).then(function () { noteIn(root, ''); });\n      }\n    });\n  }\n\n  /* -------------------------------------------------------------- 建卡器 */\n\n  function fieldControl(f, p) {\n    var attrs = ' data-field=\"' + esc(f.key) + '\" data-type=\"' + esc(f.type) + '\"';\n    if (f.type === 'list') {\n      return '<label class=\"hud-field hud-field--wide\"><span class=\"hud-field__l\">' +\n        esc(f.label) + '</span><textarea class=\"hud-input hud-input--area\" rows=\"3\"' + attrs +\n        ' placeholder=\"' + esc(f.hint || '') + '\">' + esc(joinList(p[f.key])) + '</textarea></label>';\n    }\n    var type = f.type === 'number' ? 'number' : 'text';\n    var extra = '';\n    if (f.type === 'number') {\n      if (f.min != null) extra += ' min=\"' + f.min + '\"';\n      if (f.max != null) extra += ' max=\"' + f.max + '\"';\n      extra += ' step=\"1\"';\n    }\n    return '<label class=\"hud-field\"><span class=\"hud-field__l\">' + esc(f.label) +\n      '</span><input class=\"hud-input\" type=\"' + type + '\"' + attrs + extra +\n      ' value=\"' + esc(p[f.key] == null ? '' : p[f.key]) + '\" placeholder=\"' +\n      esc(f.hint || '') + '\"' + '></label>';\n  }\n\n  function createHtml(state) {\n    var p = objectOf(state, CONFIG.playerObject);\n    var on = pressureOn(state);\n    var scale = scaleOf(state);\n    var controls = [];\n    for (var i = 0; i < CONFIG.fields.length; i++) controls.push(fieldControl(CONFIG.fields[i], p));\n    return '' +\n      '<div class=\"hud hud--create\" data-create>' +\n      '  <div class=\"hud__head\">' +\n      '    <span class=\"hud__title\">写一个自己</span>' +\n      '    <span class=\"hud__brief\">填完点「封缄 · 开始」</span>' +\n      '  </div>' +\n      '  <div class=\"hud__grid\">' + controls.join('') + '</div>' +\n      '  <div class=\"hud__row\">' +\n      '    <button type=\"button\" class=\"hud-btn hud-btn--quiet\" data-act=\"scale\">叙事尺度：' +\n      esc(scale) + '</button>' +\n      '    <button type=\"button\" class=\"hud-btn hud-btn--quiet\" data-act=\"pressure\">时局压力：' +\n      (on ? '开' : '关') + '</button>' +\n      '  </div>' +\n      moduleBlocks('create', state) +\n      '  <div class=\"hud__foot\">' +\n      '    <button type=\"button\" class=\"hud-btn hud-btn--main\" data-act=\"submit\">封缄 · 开始</button>' +\n      '    <button type=\"button\" class=\"hud-btn hud-btn--quiet\" data-act=\"reset\">清空</button>' +\n      '  </div>' +\n      '  <div class=\"hud__note\" data-note hidden></div>' +\n      '</div>';\n  }\n\n  function renderCreateView(root) {\n    if (!root) return;\n    /* 只绑一次：监听挂在 root 上，后面的重画换的是 root 里的内容，不动这个监听 */\n    bindCreate(root);\n    root.innerHTML = createHtml({});\n    readState().then(function (state) {\n      /* 读变量是异步的，回来时玩家可能已经动手填了 —— 动过就不覆盖，别把人写的字吃掉 */\n      if (touched(root)) return;\n      root.innerHTML = createHtml(state);\n    });\n  }\n\n  /* 表单里有没有人填过东西 */\n  function touched(root) {\n    var got = readCreateForm(root);\n    var any = false;\n    Object.keys(got).forEach(function (k) {\n      var v = got[k];\n      if (isArr(v) ? v.length > 0 : str(v) !== '') any = true;\n    });\n    return any;\n  }\n\n  function readCreateForm(root) {\n    var out = {};\n    each('[data-field]', function (el) {\n      var key = el.getAttribute('data-field');\n      var type = el.getAttribute('data-type');\n      if (type === 'list') out[key] = parseList(el.value);\n      else if (type === 'number') {\n        var min = el.getAttribute('min'), max = el.getAttribute('max');\n        var v = Math.round(num(el.value, 0));\n        out[key] = clamp(v, num(min, v), num(max, v));\n      } else out[key] = str(el.value);\n    }, root);\n    return out;\n  }\n\n  /* 封缄 = 把表单写回变量。\n     默认走 input.set（只填不送）：把请求放进输入框、由玩家自己按发送，\n     这样不会有人替你把对话视口搬走 —— 建卡器就长在对话的那一楼里。\n\n     写完（成不成都在）之后叫一次模块的 afterSubmit：「备份」要在这一刻\n     把整份草稿与刚写进去的档案一起存进那个过夜的地方。 */\n  function submit(root) {\n    var patch = readCreateForm(root);\n    noteIn(root, '正在封缄…');\n    return writeObject(CONFIG.playerObject, patch, root).then(function (warn) {\n      afterSubmit(root, warn);\n      var e = api();\n      if (e && e.input && typeof e.input.set === 'function') {\n        return call('input.set', [CONFIG.openingAsk]).then(function () {\n          noteIn(root, warn ? warn : '已写入变量，并把开场请求填进了输入框 —— 确认后按发送。',\n            warn ? 'is-error' : 'is-ok');\n        });\n      }\n      noteIn(root, warn ? warn : '已写入变量。', warn ? 'is-error' : 'is-ok');\n    }).catch(function (err) {\n      noteIn(root, '写入失败：' + msgOf(err), 'is-error');\n    });\n  }\n\n  function bindCreate(root) {\n    root.addEventListener('click', function (ev) {\n      var t = ev.target;\n      while (t && t !== root && !t.getAttribute('data-act')) t = t.parentNode;\n      if (!t || t === root) return;\n      var act = t.getAttribute('data-act');\n      if (act === 'submit') { submit(root); return; }\n      if (act === 'reset') {\n        each('[data-field]', function (el) { el.value = ''; }, root);\n        noteIn(root, '已清空（变量没动）。');\n        return;\n      }\n      if (act === 'scale') {\n        var next = nextScale(t.getAttribute('data-scale') || t.textContent.replace(/^.*：/, ''));\n        t.setAttribute('data-scale', next);\n        safeText(t, '叙事尺度：' + next);\n        writeScale(next, root).then(function (r) {\n          noteIn(root, r.warn || ('叙事尺度已拨到「' + r.value +\n            '」—— 这一档是什么意思，本卡不解释，由你的预设决定。'),\n            r.warn ? 'is-error' : 'is-ok');\n        });\n        return;\n      }\n      if (act === 'pressure') {\n        var on = t.textContent.indexOf('开') >= 0;\n        var nextOn = !on;\n        safeText(t, '时局压力：' + (nextOn ? '开' : '关'));\n        writeObject(CONFIG.worldObject, mkPatch(CONFIG.pressureKey, nextOn), root).then(function (warn) {\n          noteIn(root, warn || ('时局压力已拨到「' + (nextOn ? '开' : '关') + '」。'),\n            warn ? 'is-error' : 'is-ok');\n        });\n        return;\n      }\n    });\n  }\n\n  /* 对象字面量里用变量当键名，得这样绕一下（ES5 没有计算属性） */\n  function mkPatch(key, value) {\n    var o = {};\n    o[key] = value;\n    return o;\n  }\n\n  /* 拨一档：册上没有的值一律按中间那一档算，认不出的值不往外写 */\n  function writeScale(v, scope) {\n    var val = str(v);\n    if (CONFIG.scaleValues.indexOf(val) < 0) val = CONFIG.scaleValues[1];\n    return writeObject(CONFIG.worldObject, mkPatch(CONFIG.scaleKey, val), scope)\n      .then(function (warn) { return { value: val, warn: warn }; });\n  }\n\n  /* -------------------------------------------------------------- 悬浮球 */\n\n  var BALL_KEY = 'card22153f-hud-ball';\n\n  function loadBallPos() {\n    try {\n      var raw = window.localStorage && window.localStorage.getItem(BALL_KEY);\n      if (!raw) return null;\n      var p = JSON.parse(raw);\n      return (p && typeof p.x === 'number' && typeof p.y === 'number') ? p : null;\n    } catch (e) { return null; }\n  }\n\n  function saveBallPos(x, y) {\n    try {\n      if (window.localStorage) {\n        window.localStorage.setItem(BALL_KEY, JSON.stringify({ x: x, y: y }));\n      }\n    } catch (e) { /* 存不了就算了，位置不记住不影响用 */ }\n  }\n\n  /* 球挂在宿主文档里：跟「这一页渲染哪个视图」无关，只要这一页渲染出了东西就该有球 */\n  function mountBall(holder, targetDoc) {\n    var doc = targetDoc || (holder && holder.ownerDocument) || document;\n    if (!doc || !doc.body) return null;\n    if (doc.querySelector('[data-ball]')) return doc.querySelector('[data-ball]');\n\n    var ball = doc.createElement('div');\n    ball.className = 'hud-ball';\n    ball.setAttribute('data-ball', '');\n    ball.textContent = '状';\n    doc.body.appendChild(ball);\n\n    var panel = doc.createElement('div');\n    panel.className = 'hud-ballpanel';\n    panel.setAttribute('data-ballpanel', '');\n    panel.hidden = true;\n    doc.body.appendChild(panel);\n\n    var pos = loadBallPos() || { x: 18, y: Math.max(18, (doc.defaultView.innerHeight || 700) - 120) };\n    place(ball, pos.x, pos.y);\n\n    function place(el, x, y) {\n      var w = doc.defaultView.innerWidth || 800, h = doc.defaultView.innerHeight || 700;\n      var bx = clamp(x, 4, Math.max(4, w - 52));\n      var by = clamp(y, 4, Math.max(4, h - 52));\n      el.style.left = bx + 'px';\n      el.style.top = by + 'px';\n      el.style.bottom = 'auto';\n      el.style.right = 'auto';\n    }\n\n    var dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;\n\n    function down(ev) {\n      var p = pointOf(ev);\n      dragging = true; moved = false;\n      sx = p.x; sy = p.y;\n      var r = ball.getBoundingClientRect();\n      ox = r.left; oy = r.top;\n      ev.preventDefault();\n    }\n\n    function move(ev) {\n      if (!dragging) return;\n      var p = pointOf(ev);\n      var dx = p.x - sx, dy = p.y - sy;\n      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;\n      place(ball, ox + dx, oy + dy);\n      if (!panel.hidden) place(panel, ox + dx - 268, oy + dy - 8);\n      ev.preventDefault();\n    }\n\n    function up() {\n      if (!dragging) return;\n      dragging = false;\n      if (moved) {\n        var r = ball.getBoundingClientRect();\n        saveBallPos(r.left, r.top);\n      } else {\n        toggle();\n      }\n    }\n\n    function pointOf(ev) {\n      var t = ev.touches && ev.touches[0] ? ev.touches[0] : ev;\n      return { x: t.clientX, y: t.clientY };\n    }\n\n    function toggle() {\n      panel.hidden = !panel.hidden;\n      if (panel.hidden) return;\n      var r = ball.getBoundingClientRect();\n      panel.innerHTML = '<div class=\"hud-ballpanel__t\">状态</div>' +\n        '<div class=\"hud-ballpanel__b\" data-ball-body>正在读取…</div>';\n      place(panel, r.left - 268, r.top - 8);\n      readState().then(function (state) {\n        var b = panel.querySelector('[data-ball-body]');\n        if (b) b.innerHTML = hasProfile(state) ? panelHtml(state) :\n          '<div class=\"hud-dim\">还没有角色档案。</div>';\n      });\n    }\n\n    ball.addEventListener('mousedown', down);\n    ball.addEventListener('touchstart', down, { passive: false });\n    doc.addEventListener('mousemove', move);\n    doc.addEventListener('touchmove', move, { passive: false });\n    doc.addEventListener('mouseup', up);\n    doc.addEventListener('touchend', up);\n\n    return ball;\n  }\n\n  /* ------------------------------------------------------------ 可选模块\n\n     模块 = 一张卡按需接的能力（骰子框、尺度说明、档案备份、AI 代笔……）。\n     它们的代码不写在上面，而是各占 hud/模块/<名>/<名>.js 一个文件\n     （一个模块一个目录，与 build_hud.py 找的是同一个形状），\n     由 hud/build_hud.py 按 hud.conf.json 的「模块」列表拼进同一页、\n     拼在核心之后。不接就不拼 —— 页面上不会多一个字节。\n\n     模块脚本是**另一段独立代码**：它进不到这个 IIFE 里面来（这里的东西\n     不外露），所以接线走注册表 —— 模块把自己的名字与挂载点交给 useModule()。\n\n     一个模块最多给四样，能给几样给几样，没给的那处就不接：\n\n       · create(state) → 一段 HTML，接在建卡器的档位行之后\n       · panel(state)  → 一段 HTML，接在面板最底下\n       · mount(hud)    → 页面就绪后自己动手（要绑事件、要常驻的走这条；\n                         hud 是下面那份导出，够它读变量、写变量、拿配置）\n       · afterSubmit(hud, root, warn) → 封缄那一笔写落定之后叫一次\n                         （root 是建卡器那一块，warn 是那笔写有没有被挡回来）\n\n     四处调用都包了 try：模块里抛出来的异常只让它自己那一块不出现，\n     面板其余部分照常 —— 一个模块坏了不该把整页拖垮。 */\n  var MODULES = [];\n  var booted = false;\n\n  function useModule(m) {\n    if (!m || typeof m !== 'object' || !str(m.name)) return false;\n    for (var i = 0; i < MODULES.length; i++) {\n      if (MODULES[i].name === m.name) return false;   /* 同一块不认识两遍 */\n    }\n    MODULES.push(m);\n    /* 正常情形下模块脚本比 boot 早（同一页里跟在后面的那一段，boot 还压在\n       DOMContentLoaded 上）。万一晚到，补画一次面板 —— 面板重画是幂等的；\n       建卡器那一份是表单，重画会吃掉已经填进去的字，所以不补它。 */\n    if (booted) each('[data-view=\"card\"]', function (root) { refresh(root); });\n    return true;\n  }\n\n  function moduleBlocks(kind, state) {\n    var out = [];\n    for (var i = 0; i < MODULES.length; i++) {\n      var fn = MODULES[i][kind];\n      if (typeof fn !== 'function') continue;\n      try {\n        var html = fn(state);\n        if (html) out.push(html);\n      } catch (e) { /* 模块自己那块画不出来，就少一块 */ }\n    }\n    return out.join('');\n  }\n\n  /* 封缄写完之后的挂载点（模块可以不给，不给就跳过）。\n     传 root 是让模块还能读到表单里那几栏，warn 是那一笔写有没有被挡回来。\n     **一定要在这一笔落定之后叫**：每一笔写都是「读出整份 → 改一处 → 整份写回」，\n     模块若抢在它前面读一遍再写，就会把刚封缄的档案盖回旧值。 */\n  function afterSubmit(root, warn) {\n    for (var i = 0; i < MODULES.length; i++) {\n      var fn = MODULES[i].afterSubmit;\n      if (typeof fn !== 'function') continue;\n      try { fn(window.CARD22153F_HUD, root, warn); } catch (e) { /* 一个模块跟不上，不该拦住建卡 */ }\n    }\n  }\n\n  /* ---------------------------------------------------------------- 导出 */\n\n  window.CARD22153F_HUD = {\n    CONFIG: CONFIG,\n    DEFAULTS: DEFAULTS,\n    esc: esc,\n    str: str,\n    num: num,\n    clamp: clamp,\n    isArr: isArr,\n    plain: plain,\n    msgOf: msgOf,\n    parseList: parseList,\n    joinList: joinList,\n    fillState: fillState,\n    objectOf: objectOf,\n    statOf: statOf,\n    readArchive: readArchive,\n    scaleOf: scaleOf,\n    nextScale: nextScale,\n    pressureOn: pressureOn,\n    valueHtml: valueHtml,\n    panelHtml: panelHtml,\n    objectRows: objectRows,\n    briefOf: briefOf,\n    hasProfile: hasProfile,\n    mkPatch: mkPatch,\n    touched: touched,\n    createHtml: createHtml,\n    readCreateForm: readCreateForm,\n    renderCardView: renderCardView,\n    renderCreateView: renderCreateView,\n    mountBall: mountBall,\n    readState: readState,\n    writeObject: writeObject,\n    whenReady: whenReady,\n    /* 宿主桥本身：有的模块要的不止「读变量 / 写变量」——\n       代笔模块要用 input.set 把请求填进对话输入框、用 messages.list 认回话。\n       桥只此一份，模块照这一份用；各写各的等于把同一件事做两遍。 */\n    api: api,\n    call: call,\n    /* 模块接线口：模块脚本就靠这两个进到这一页里来 */\n    useModule: useModule,\n    modules: function () { return MODULES.slice(); }\n  };\n\n  /* ------------------------------------------------------------ 自动启动 */\n\n  function boot() {\n    booted = true;\n    var createRoot = document.querySelector('[data-view=\"create\"]');\n    if (createRoot) renderCreateView(createRoot);\n    var cardRoot = document.querySelector('[data-view=\"card\"]');\n    if (cardRoot) renderCardView(cardRoot);\n    var holder = cardRoot || createRoot;\n    if (holder) mountBall(holder);\n    for (var i = 0; i < MODULES.length; i++) {\n      if (typeof MODULES[i].mount !== 'function') continue;\n      try { MODULES[i].mount(window.CARD22153F_HUD); }\n      catch (e) { /* 一个模块挂不上，别的照挂 */ }\n    }\n  }\n\n  if (typeof document !== 'undefined') {\n    if (document.readyState === 'loading') {\n      document.addEventListener('DOMContentLoaded', boot);\n    } else {\n      /* 已经过了 loading 也往后压一格：同一页里跟在后面的模块脚本还没跑，\n         boot 早跑一步，模块就赶不上这一画。 */\n      setTimeout(boot, 0);\n    }\n  }\n})();\n\n</script>\n</body>\n</html>\n```"
