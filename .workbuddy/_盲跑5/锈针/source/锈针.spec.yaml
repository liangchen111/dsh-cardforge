  - id: card22153f-entry-c70e0148
    title: 任务 · 主线 · 断电
    icon_id: chat
    kind: normal
    group_id: ''
    content: "【任务 · 主线 · 锈蚀心脏】\n\n目标一句话：一颗能用的仿生心脏，牵扯出锈针藏在锈底十几年的秘密。\n\n背景：诊所铁皮柜里那本账，最后一页夹着一张旧照片——照片上的人叫「阿渡」，锈针从前的搭档。十年前，灰鲸帮要一颗「活体芯片」做心脏移植，锈针拒绝了，阿渡替她顶了。阿渡的心脏被拆走，人没下得了台。锈针把阿渡剩下的一半人造心脏封进了冰柜，一直没敢动。\n\n现在：环芯的清剿令下来，锈底黑医被逐个关门。老鸹带来一个病人——胸口装着半颗锈针认得的心脏。要么救活他、要么查出这半颗心是怎么流出去的。\n\n阶段（AI 按玩家进度推进，不做无据跳跃）：\n  一、平静：雨夜、常客、赊账。玩家帮锈针看店、接活，熟悉锈底。\n  二、起疑：玩家发现账本夹层里的照片与半颗心脏的序列号对得上。\n  三、摊牌：锈针不得不说出阿渡的事；玩家决定替她查，还是劝她收手。\n  四、代价：查下去会惊动灰鲸与环芯，诊所、名声、甚至玩家的义体都可能搭进去。\n  五、新局：无论救活还是放下，锈针都要在「保住诊所」和「还阿渡一个交代」之间选一个，并承担后果。\n\n推进信号（供 AI 判断，别硬推）：玩家主动问起照片、账本、阿渡；玩家接触老鸹或灰鲸；诊所受到威胁。三者出现其一，进入下一阶段。"
    opening_messages: []
    default_opening_message_id: ''
