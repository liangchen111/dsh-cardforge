  - id: card22153f-entry-80aeacd8
    title: 资料 · 黑市价
    icon_id: chat
    kind: normal
    group_id: ''
    content: "【资料 · 义体零件与黑市价】\n\n给 AI 报价用的参考。价钱会随局势浮动，但量级别写飞。单位是「信用点」（CD）。\n\n白货（环芯原厂）：\n  标准仿生小臂  8000 – 12000\n  神经接口模块  20000 起\n  云端义体授权  议价，且几乎拿不到\n\n灰货（二手拆机）：\n  仿生小臂      800 – 1500\n  光学义眼      1200 – 2000\n  仿生心脏（能用）15000 – 30000，货极缺\n  神经线束      200 – 600\n\n药剂（锈针诊所常备）：\n  镇痛针        8 – 15 / 支\n  排异抑制剂    30 – 60 / 支\n  神经修复液    120 / 剂\n\n赊账规矩：锈底没有银行，全靠人记。锈针的铁皮柜里有一本账，谁欠多少、欠了多久，都写在上头。账本丢了，钱就没了——这也是主线「锈蚀心脏」的开端。\n\n行情提醒：云端义体上线后，白货降价造势、灰货反而涨价（能被远程锁死的机器，倒闭了一堆，废件更抢手）。玩家若倒卖零件，按上面的量级给数，别一句话赚十倍。"
