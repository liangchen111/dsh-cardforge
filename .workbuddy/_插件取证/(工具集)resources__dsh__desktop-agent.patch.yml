# The desktop Web Host owns ElecKoi's Agent Sessions and browser plugins.
- id: system-prompt
  config:
    personaPrefix: You are ElecKoi.
    personaSuffix: ''

- id: attachment-local
  config:
    dshHome: !!js process.env.DSH_HOME
    maxImageBytes: 20971520
    maxImagesPerMessage: 4
    maxMessageImageBytes: 20971520

- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: none

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: approval
  config:
    policy: never

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      eleckoi-workspace:
        sandbox: workspace-write
        approval: never
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: eleckoi-workspace

- id: agent-preset-registry
  config:
    default: eleckoi-default

