  entries:
  - id: fixed-opening-assistant
    title: AI角色开场白
    icon_id: chat
    kind: opening
    group_id: ''
    content: '潮水在墙外涨上来的时候，铺子里的钟一起慢了一拍。


      老人正站在梯子上给一座落地钟上油。他听见脚步，没有回头，只把油壶搁在钟顶，等你走到柜台前才慢慢下来。袖口上沾着一层洗不掉的旧铜锈。


      「第一次来这儿？」他替你把椅子拉出来，动作很慢，「这条巷子天黑以后，肯进门的没几个。」


      灯芯噼啪响了一下。他从柜台底下端出一只封着蜡的锡盒，推到两人中间，却不上锁，也不打开。


      「修钟我不问东西的来路。」他的手指在盒盖上敲了两下，「今晚你把它拿走，还是留下，我都当没看见。只是——出了这个门，今晚的事，你没来过，我也没开过门。」​​​'
    opening_messages:
